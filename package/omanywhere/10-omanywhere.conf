# Omanywhere: ssh is the container's way in, with keys only and never as root.
# sshd keeps the first value it reads for most keywords, so this file sorts
# before the others here (Arch's 99-archlinux.conf among them).
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitRootLogin no

# Host keys live in the state volume, so a recreated container keeps them.
# sshdgenkeys.service makes them there (its omanywhere.conf drop-in): the same
# types `ssh-keygen -A` makes in /etc/ssh, under the prefix it takes.
HostKey /var/lib/omanywhere/ssh/etc/ssh/ssh_host_ed25519_key
HostKey /var/lib/omanywhere/ssh/etc/ssh/ssh_host_ecdsa_key
HostKey /var/lib/omanywhere/ssh/etc/ssh/ssh_host_rsa_key
HostKey /var/lib/omanywhere/ssh/etc/ssh/ssh_host_mldsa44_ed25519_key
