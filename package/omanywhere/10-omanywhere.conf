# Omanywhere: ssh is the container's way in, with keys only (see the
# exception below) and never as root.
# sshd keeps the first value it reads for most keywords, so this file sorts
# before the others here (Arch's 99-archlinux.conf among them).
# The one exception: a container with a password and no ssh key, where the
# owner script (/usr/lib/omanywhere/owner, which says why) writes password.conf
# to let the owner log in with the password and nobody else. It is included
# first because sshd keeps the first value it reads. sshd trusts what it
# includes, so this is safe only because /run/omanywhere/sshd is root's and
# 0755 (the owner script makes it so); with no such file nothing matches.
Include /run/omanywhere/sshd/password.conf
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitRootLogin no

# The keys given to the container (omanywhere-owner.service writes them each
# boot), beside the owner's own ~/.ssh/authorized_keys.
AuthorizedKeysFile .ssh/authorized_keys /run/omanywhere/authorized_keys/%u

# The host key lives in the state volume, so a recreated container keeps it;
# sshdgenkeys.service makes it there (its omanywhere.conf drop-in).
HostKey /var/lib/omanywhere/ssh/ssh_host_ed25519_key

# How gliff-server captures and encodes, for the desktop's card: SetEnv
# GLIFF_VIDEO and GLIFF_CAPTURE for every session, so a plain gliff client
# needs no flags. The desktop session writes it each boot
# (/usr/lib/omanywhere/session prepare), then restarts sshd if it runs or is
# starting (try-restart: systemd would drop a reload for an sshd still
# starting), so sshd reads this Include again; KillMode=process keeps the
# sessions already open. With no desktop nothing matches, and gliff-server
# keeps its defaults.
# sshd trusts what it includes, and this is safe only because
# /run/omanywhere/sshd is root's and 0755 (session prepare, which runs as
# root, makes it so), so only root writes there.
# It's a workaround: once gliff-server falls back to the CPU and shm by
# itself, this goes. Upstream: gliff, --video gpu errors instead of falling
# back to the CPU and shm capture (not yet filed).
Include /run/omanywhere/sshd/*.conf
