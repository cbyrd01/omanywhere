# Omanywhere: ssh is the container's way in, with keys only and never as root.
# sshd keeps the first value it reads for most keywords, so this file sorts
# before the others here (Arch's 99-archlinux.conf among them).
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitRootLogin no

# The keys given to the container (omanywhere-owner.service writes them each
# boot), beside the owner's own ~/.ssh/authorized_keys.
AuthorizedKeysFile .ssh/authorized_keys /run/omanywhere/authorized_keys/%u

# The host key lives in the state volume, so a recreated container keeps it;
# sshdgenkeys.service makes it there (its omanywhere.conf drop-in).
HostKey /var/lib/omanywhere/ssh/ssh_host_ed25519_key
