# Omanywhere: make sshd's host keys in the state volume, which outlives the
# container, instead of in /etc/ssh, which is the image's each time the
# container is recreated. `ssh-keygen -A -f PREFIX` makes the stock set of
# keys under PREFIX/etc/ssh and skips those that exist, so it runs every boot.
[Unit]
ConditionPathExists=

[Service]
ExecStart=
ExecStart=/usr/bin/ssh-keygen -A -f /var/lib/omanywhere/ssh
