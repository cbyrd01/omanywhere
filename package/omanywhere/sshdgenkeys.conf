# Omanywhere: make sshd's host key in the state volume, which outlives the
# container, instead of in /etc/ssh, which is the image's each time the
# container is recreated. One ed25519 key (sshd_config.d/10-omanywhere.conf).
[Unit]
ConditionPathExists=
ConditionPathExists=!/var/lib/omanywhere/ssh/ssh_host_ed25519_key

[Service]
ExecStart=
ExecStart=/usr/bin/ssh-keygen -q -t ed25519 -N '' -f /var/lib/omanywhere/ssh/ssh_host_ed25519_key
