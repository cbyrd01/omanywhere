# Omanywhere: lets polkit start in a container without CAP_SYS_ADMIN.
#
# systemd#34565: for a unit with User= and a system call filter, systemd keeps
# CAP_SYS_ADMIN across the switch to the user so it can load the filter
# afterwards (keep_capability(CAP_SYS_ADMIN)); without that capability, as in
# a container with Docker's default set, it fails at step USER (217) and
# polkit never runs: no polkit agent for Omarchy's shell, no pkexec.
# Denying capset makes seccomp_allows_drop_privileges() false, so systemd
# skips that path and loads the filter with NoNewPrivileges= instead. This
# only tightens polkit's filter: polkitd never calls capset.
# Upstream draft: notes/upstream/systemd-keep-cap-sys-admin.md.
[Service]
SystemCallFilter=~capset
