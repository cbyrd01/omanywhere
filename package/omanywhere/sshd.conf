# Omanywhere: sshd starts only once the owner exists, and not at all when the
# owner unit failed (no key given, say): ssh is for the owner. It doesn't wait
# for the desktop session: the session reloads sshd once it has written the
# gliff environment (see sshd_config.d/10-omanywhere.conf).
[Unit]
Requires=omanywhere-owner.service
After=omanywhere-owner.service
