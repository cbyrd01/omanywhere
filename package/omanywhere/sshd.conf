# Omanywhere: sshd starts only once the owner exists, and not at all when the
# owner unit failed (no key given, say): ssh is for the owner.
#
# It also starts after the desktop session has written the gliff environment
# for its card (/run/omanywhere/sshd/gliff.conf, included from
# sshd_config.d/10-omanywhere.conf), because sshd reads its config once, when
# it starts. That's ordering only: a skipped or failed desktop doesn't stop
# sshd, and the session's start job ends as soon as Hyprland's start is under
# way.
[Unit]
Requires=omanywhere-owner.service
After=omanywhere-owner.service omanywhere-session.service
