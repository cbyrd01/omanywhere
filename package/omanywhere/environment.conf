# Omanywhere: the environment of the owner's user manager, which the desktop
# session runs in (environment.d(5)). The session script adds what depends on
# the boot's DRM card (/usr/lib/omanywhere/session).

# Hyprland's config: the owner's ~/.config/hypr/hyprland.lua, then the
# container's monitor rules (/usr/share/omanywhere/hypr/hyprland.lua has why).
HYPRLAND_CONFIG=/usr/share/omanywhere/hypr/hyprland.lua

# libseat's noop backend: Hyprland opens the DRM card itself, through the
# owner's groups (/usr/lib/omanywhere/owner), instead of asking logind for it.
# logind can't give it: its TakeDevice answers ENODEV for every node, because
# it looks devices up in udev's database and a container runs no udev (and
# shouldn't: udev would act on the host's devices). Even with udev, logind
# would make the session DRM master, which the host's own desktop holds on a
# shared GPU. Seen with logind 262 in the container on an NVIDIA card; libseat
# then fails and Hyprland aborts ("CBackend::create() failed!").
LIBSEAT_BACKEND=noop
