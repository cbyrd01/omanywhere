name: Measure
on:
  push:
    branches: [ci-image]
permissions:
  contents: read
jobs:
  m:
    runs-on: ubuntu-26.04
    steps:
      - run: |
          lsblk -o NAME,SIZE,MOUNTPOINT
          sudo du -xsh /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache /opt/ghc /usr/local/share/boost /opt/microsoft /usr/local/.ghcup /usr/share/swift /home/runner/.rustup /home/runner/.cargo /usr/lib/google-cloud-sdk /usr/lib/jvm /usr/local/lib/node_modules /swapfile /mnt || true
          sudo du -xh --max-depth=2 /usr /opt /home/runner /var 2>/dev/null | sort -rh | head -25 || true
